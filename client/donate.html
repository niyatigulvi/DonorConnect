<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Donate Item - DonorConnect</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="donate-page">

    <!-- Header -->
    <header class="page-header">

        <a href="home.html" class="back-button">←</a>

        <div>
            <h2>Donate an Item</h2>
            <p>Share what you can</p>
        </div>

    </header>


    <!-- Main -->
    <main class="donate-container">

        <div class="donate-intro">

            <h1>Make a Difference 💚</h1>

            <p>
                Select a category and provide the details of the item
                you want to donate.
            </p>

        </div>


        <!-- Category -->
        <section class="donate-section">

            <h2>Select Category</h2>

            <div class="donate-categories">

                <button
                    type="button"
                    class="donate-category active"
                    data-category="Clothes">

                    <span>👕</span>
                    <strong>Clothes</strong>
                    <small>Donate clothes</small>

                </button>


                <button
                    type="button"
                    class="donate-category"
                    data-category="Books">

                    <span>📚</span>
                    <strong>Books</strong>
                    <small>Share knowledge</small>

                </button>


                <button
                    type="button"
                    class="donate-category"
                    data-category="Food">

                    <span>🍱</span>
                    <strong>Food</strong>
                    <small>Help someone</small>

                </button>

            </div>

        </section>


        <!-- Donation Form -->
        <section class="donate-form-card">

            <form id="donationForm">

                <input
                    type="hidden"
                    id="selectedCategory"
                    value="Clothes"
                >


                <div class="form-group">

                    <label for="itemName">
                        Item Name
                    </label>

                    <input
                        type="text"
                        id="itemName"
                        placeholder="Example: Cotton Clothes"
                        required
                    >

                </div>


                <div class="form-row">

                    <div class="form-group">

                        <label for="quantity">
                            Quantity
                        </label>

                        <input
                            type="number"
                            id="quantity"
                            min="1"
                            placeholder="Enter quantity"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="condition">
                            Condition
                        </label>

                        <select id="condition" required>

                            <option value="">
                                Select condition
                            </option>

                            <option value="New">
                                New
                            </option>

                            <option value="Good">
                                Good
                            </option>

                            <option value="Used">
                                Used
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Describe your donated item..."
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="location">
                        Pickup Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        placeholder="Enter pickup location"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="itemImage">
                        Item Photo
                    </label>

                    <input
                        type="file"
                        id="itemImage"
                        accept="image/*"
                    >

                    <small class="file-note">
                        Upload a clear photo of the item.
                    </small>

                </div>


                <button
                    type="submit"
                    class="submit-donation-btn">

                    Donate Item

                </button>

            </form>

        </section>

    </main>


    <!-- Bottom Navigation -->
    <nav class="bottom-nav">

        <a href="home.html">
            <span>🏠</span>
            <small>Home</small>
        </a>

        <a href="donations.html">
            <span>🎁</span>
            <small>Donations</small>
        </a>

        <a href="donate.html" class="nav-donate">
            <span>＋</span>
        </a>

        <a href="notifications.html">
            <span>🔔</span>
            <small>Alerts</small>
        </a>

        <a href="profile.html">
            <span>👤</span>
            <small>Profile</small>
        </a>

    </nav>


    <script src="js/script.js"></script>
<script>
document.getElementById("donationForm").addEventListener("submit", async function(event) {

    event.preventDefault();

    const donationData = {
        user_id: 1,
        category: document.getElementById("selectedCategory").value,
        item_name: document.getElementById("itemName").value,
        description: document.getElementById("description").value,
        quantity: document.getElementById("quantity").value,
        condition: document.getElementById("condition").value,
        location: document.getElementById("location").value
    };

    try {

        const response = await fetch("http://localhost:3000/api/donations", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(donationData)
        });

        const result = await response.json();

        if (result.success) {
            alert("Donation submitted successfully!");
            window.location.href = "donations.html";
        } else {
            alert(result.message);
        }

    } catch (error) {
        console.error(error);
        alert("Server connection failed.");
    }

});
</script>
</body>
</html>
